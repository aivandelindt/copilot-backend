services:
  copilot-cli:
    image: ghcr.io/github/copilot-cli:1.0.115
    # The image entrypoint already execs:
    # copilot --headless --no-auto-update --host 0.0.0.0 --port 4321
    command: ["--session-idle-timeout", "3600"]
    environment:
      COPILOT_CONNECTION_TOKEN: ${COPILOT_CONNECTION_TOKEN:-}
      COPILOT_GITHUB_TOKEN: ${COPILOT_GITHUB_TOKEN:-}
      COPILOT_PORT: "4321"
    ports:
      - "4321:4321"
    restart: unless-stopped
    volumes:
      - copilot-home:/home/copilot/.copilot

  api:
    build: .
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      CLI_URL: copilot-cli:4321
      COPILOT_CONNECTION_TOKEN: ${COPILOT_CONNECTION_TOKEN:-}
      MODEL: ${MODEL:-gpt-5.4}
      SESSION_MAX_AGE_MS: ${SESSION_MAX_AGE_MS:-86400000}
      CLEANUP_INTERVAL_MS: ${CLEANUP_INTERVAL_MS:-3600000}
      CHAT_TIMEOUT_MS: ${CHAT_TIMEOUT_MS:-120000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    ports:
      - "3000:3000"
    depends_on:
      - copilot-cli
    restart: unless-stopped

volumes:
  copilot-home:
